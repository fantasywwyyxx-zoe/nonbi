    h = '<div class="brand">の ん び ー</div>'

      + '<div class="say tdots" style="bottom:150px"><span></span><span></span><span></span></div>'
      + '<div class="say" style="bottom:112px;font-size:14px;color:#8a6d3f">池袋の144軒から探してるよ</div>';
  } else if(s.screen==='results'){
    var list = s.order.slice(0, s.shown);
    h = '<video class="botimg botvid" src="assets/idle.mp4" autoplay muted loop playsinline style="width:190px;top:0"></video>'
      + '<div class="say" style="top:196px;font-size:15px">まずこの3軒、どう？</div>'
      + '<div class="sheet" style="top:236px"><div class="grip"></div>'
      + list.map(function(i){ return cardHtml(SHOPS[i], i); }).join('')
      + (s.shown < Math.min(15, s.order.length) ? '<button class="more" onclick="more()">もっと見る（+6軒）</button>' : '')
      + '<div style="display:flex;gap:14px"><button class="back" onclick="go(\'idle\')">← 最初から</button><button class="back" onclick="editAns()">条件を変える</button></div></div>';
  } else if(s.screen==='detail'){
    var sh = SHOPS[s.shop];
    var top2 = sh.img ? '<img src="'+PH[sh.img]+'" style="width:100%;height:158px;object-fit:cover;border-radius:12px">' : '<div class="noimg" style="height:92px;border-radius:12px">'+sh.g+'（写真は準備中）</div>';
    h = '<div class="sheet" style="top:22px"><div class="grip"></div>' + top2
      + '<div style="font-weight:800;font-size:17px;margin-top:9px">'+sh.n+'</div>'
      + '<div class="scores">'
      + (sh.gs ? '<span class="sc g">Google ★'+sh.gs+'（'+sh.gc+'件）</span>' : '')
      + (sh.ts ? '<span class="sc t">食べログ '+sh.ts+'（'+sh.tc+'件）</span>' : '')
      + '</div>'
      + '<div class="kv" style="margin-top:8px"><b>住所</b>'+sh.a+'<br><b>営業</b>'+sh.h+'<br><b>予算</b>'+sh.b+(sh.s ? '<br><b>酒</b>'+sh.s : '')+'</div>'
      + (sh.w ? '<div class="tip"><img src="'+MASCOT+'"><div>'+sh.w+'</div></div>' : '')
      + '<div class="btnrow">'
      + (sh.t ? '<a class="btn tel" href="tel:'+sh.t.replace(/-/g,'')+'">電話する</a>' : '<span class="btn off">電話 未確認</span>')
      + '<button class="btn map" onclick="setPick(true)">地図を開く</button></div>'
      + '<button class="back" style="margin-top:11px" onclick="go(\'results\')">← おすすめに戻る</button></div>';
  }
  if(s.pick && s.shop !== null && s.shop !== undefined){
    var sh2 = SHOPS[s.shop];
    h += '<div class="pickwrap"><div class="pick"><h3>どのマップで開く？</h3>'
      + '<a class="prow" target="_blank" href="'+mapUrl('google', sh2.n + ' 池袋')+'">Google マップ</a>'
      + '<a class="prow" target="_blank" href="'+mapUrl('apple', sh2.n + ' 池袋')+'">Apple マップ</a>'
      + '<a class="prow" target="_blank" href="'+mapUrl('yahoo', sh2.n + ' 池袋')+'">Yahoo!マップ</a>'
      + '<button class="pcancel" onclick="setPick(false)">キャンセル</button></div></div>';
  }
  ph.innerHTML = h;
}
function save(){ window.hatchWidget.setState(window.__S); }
function go(sc){ window.__S.screen = sc; if(sc==='ask'){window.__S.step=0; window.__S.ans={};} if(sc==='results' && !window.__S.order.length){window.__S.screen='idle';} save(); render(); }
function answer(k, v){
  window.__S.ans[k] = v;
  if(window.__S.step < QS.length-1){ window.__S.step++; }
  else { window.__S.screen='think'; save(); render(); setTimeout(function(){ window.__S.order = rankShops(window.__S.ans); window.__S.shown = 3; window.__S.screen='results'; save(); render(); }, 1700); return; }
  save(); render();
}
function backStep(){ if(window.__S.step > 0){ window.__S.step--; } else { window.__S.screen='idle'; } save(); render(); }
function editAns(){ window.__S.screen='ask'; window.__S.step=0; save(); render(); }
function more(){ window.__S.shown = Math.min(15, window.__S.shown + 6); save(); render(); }
function openShop(id){ window.__S.shop=id; window.__S.screen='detail'; save(); render(); }
function setPick(b){ window.__S.pick=b; save(); render(); }
window.addEventListener('hatch-widget-state', function(e){ window.__S = e.detail.state; render(); });
window.__S = window.hatchWidget.getState(DEF);
render();
</script>

*{box-sizing:border-box;margin:0;padding:0}
.wrap{font-family:'M PLUS Rounded 1c',-apple-system,'Hiragino Sans','Noto Sans SC',sans-serif;color:var(--hatch-widget-text);padding:4px 2px 8px}
.note{font-size:12px;color:var(--hatch-widget-muted);line-height:1.6;margin-bottom:8px}
.phone{border:none;border-radius:0;overflow:hidden;height:100dvh;position:relative;background:#fff9ef;color:#221a10;max-width:430px;margin:0 auto;box-shadow:none}
.brandlogo{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:204px;z-index:4}
.brand{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:13px;font-weight:800;letter-spacing:.16em;color:#17130c;z-index:5}
.areaSwitch{position:absolute;top:84px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:4;background:#ffffff;border:2px solid #17130c;border-radius:999px;padding:3px;box-shadow:0 2px 0 #17130c}
.asw{font-family:inherit;font-size:14.5px;font-weight:800;padding:7px 15px;border-radius:999px;border:none;background:transparent;color:#17130c;cursor:pointer;white-space:nowrap}
.asw.on{background:linear-gradient(180deg,#ff8a1e,#ff6a00);color:#ffffff}
.areaCnt{position:absolute;top:128px;left:0;right:0;text-align:center;font-size:12.5px;font-weight:700;color:#8a6d3f;z-index:4}
.area{position:absolute;top:36px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:800;color:#17130c;background:#ff7a00;color:#ffffff;border:1.8px solid #17130c;border-radius:999px;padding:4px 14px;z-index:5;white-space:nowrap}
#botlayer{position:absolute;inset:0;z-index:2;pointer-events:none}
.botwrap{position:absolute;left:50%;transform:translateX(-50%);z-index:2;transition:width .8s cubic-bezier(.5,0,.2,1),top .8s cubic-bezier(.5,0,.2,1)}
.botm{width:100%;display:block;transition:opacity .9s ease}
.botstack .botm{position:absolute;left:0;top:0}
.botstack .botm:first-child{position:relative}
.say{position:absolute;left:0;right:0;text-align:center;font-weight:800;line-height:1.55;padding:0 26px;z-index:4;color:#221a10}
.say .hl{box-shadow:inset 0 -0.40em 0 rgba(255,122,0,.35);border-radius:2px;padding:0 2px}
#homesay{top:66%}
.pillbtn{position:absolute;left:50%;transform:translateX(-50%);background:#17130c;color:#ffd83d;font-weight:800;font-size:17px;border-radius:999px;padding:15px 42px;z-index:4;cursor:pointer;border:none;font-family:inherit}
.qbox{position:absolute;left:0;right:0;bottom:14px;padding:0 20px;z-index:4;animation:up .35s cubic-bezier(.3,0,.2,1)}
.qtext{text-align:center;font-size:20px;font-weight:800;color:#221a10;margin-bottom:12px}
.qtext .pg{font-size:12.5px;color:#7a5f2e;font-weight:700}
.bars{display:flex;flex-direction:column;gap:7px}
.bars.compact{gap:5px}
.bars.compact .bar{padding:8px 14px}
.bar{position:relative;display:flex;align-items:center;background:rgba(255,255,255,.96);border:2px solid #17130c;border-radius:14px;padding:11px 14px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;width:100%;color:#17130c;box-shadow:0 2px 0 #17130c;text-align:left}
.bar:active{transform:translateY(2px);box-shadow:none}
.bdg{flex:none;width:27px;height:27px;border-radius:8px;background:#17130c;color:#ffd83d;font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-right:12px}
.bar .lb{flex:1;text-align:center}

.bar .sub{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11.5px;color:#8a6d3f;font-weight:700}
.bar .sp{flex:none;width:39px}
.backbtn{position:absolute;top:12px;left:12px;z-index:7;background:rgba(255,255,255,.9);border:1.8px solid #17130c;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;color:#17130c}
.tdots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#17130c;margin:0 4px;animation:tp 1s infinite}
.tdots span:nth-child(2){animation-delay:.18s}.tdots span:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes up{from{transform:translateY(26px);opacity:.3}to{transform:translateY(0);opacity:1}}
#ph{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#ph img{-webkit-user-drag:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;border-top:2.2px solid #17130c;padding:12px 14px 16px;color:#111;z-index:6;max-height:92%;overflow-y:auto;animation:up .45s cubic-bezier(.3,0,.2,1)}
.grip{width:40px;height:4.5px;border-radius:99px;background:#ddd;margin:0 auto 10px}
.card{border:2px solid #111;border-radius:15px;overflow:hidden;margin-bottom:10px;cursor:pointer;background:#fff}
.card img{width:100%;height:112px;object-fit:cover;display:block}
.dthumbs{display:flex;gap:6px;margin-top:6px}.dthumbs img{flex:1;min-width:0;height:54px;object-fit:cover;border-radius:10px}
.noimg{height:84px;background:linear-gradient(120deg,#e9dcc2,#dcc7a2);display:flex;align-items:center;justify-content:center;font-weight:800;color:#7a5f2e;font-size:13.5px;letter-spacing:.12em;text-align:center;padding:0 10px}
.cb{padding:9px 12px}.nm{font-weight:800;font-size:16px;color:#111}.mt{font-size:12.5px;color:#555;margin-top:3px;line-height:1.55}
.scores{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.sc{font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 8px}
.sc.g{background:#111;color:#ffd83d}.sc.t{background:#ffd83d;color:#111;border:1.2px solid #111}
.sc.d{background:#ffffff;color:#17130c;border:1.8px solid #17130c;margin-left:auto;font-size:12px}
.sortrow{display:flex;gap:6px;margin:0 0 10px}

var AC = null;
function beep(f0, f1, dur, vol){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol || 0.10, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

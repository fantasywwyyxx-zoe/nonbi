      + '<div class="say" style="bottom:132px;font-size:21px">今夜の一杯、まかせて</div>'
      + '<button class="pillbtn" style="bottom:64px" onclick="go(\'ask\')">はじめる</button>'
      + '';
  } else if(s.screen==='ask'){
    var cur = QS[s.step];
    setBot('sz-ask', 'asking', cur.opts.length);
    setTimeout(function(){ var be = document.getElementById('boteyes'); if(be) be.style.transform = 'translateX(' + (s.step % 2 ? -3 : 3) + 'px)'; }, 30);
    h = '<button class="backbtn" onclick="backStep()">← もどる</button>'
      + '<div class="qbox"><div class="qprog"><i style="width:'+Math.round((s.step+1)/QS.length*100)+'%'+'"></i></div><div class="qtext"><span class="qchip">Q'+(s.step+1)+'</span>'+cur.q+' <span class="pg">('+(s.step+1)+'/'+QS.length+')</span></div>'
      + '<div class="bars'+(cur.opts.length>=6?' compact':'')+'">'+cur.opts.map(function(o){return '<button class="bar" onclick="answer(\''+cur.k+'\',\''+o[1]+'\')"><span class="lb">'+o[1]+'</span>'+(o[2]?'<span class="sub">'+o[2]+'</span>':'')+'</button>'}).join('')+'</div></div>';
  } else if(s.screen==='think'){
    setBot('sz-think', 'thinking');
    h = '<div class="say tdots" style="bottom:150px"><span></span><span></span><span></span></div>'
      + '<div class="say" style="bottom:112px;font-size:15px;color:#7a5f2e">' + areaName() + 'の' + SHOPS.length + '軒から探してるよ</div>';
  } else if(s.screen==='results'){
    setBot('sz-res', 'idle');
    setTimeout(function(){ var w = document.getElementById('botwrap'); if(w){ var wr = w.getBoundingClientRect(); spawnBurst(wr.left + wr.width/2, wr.top + wr.height*0.3, 9); } }, 350);
    var list = s.order.slice(0, s.shown);
    h = '<button class="backbtn" onclick="backToLastQ()">← もどる</button>'
      + '<div class="say" style="top:196px;font-size:16px">まずこの3軒、どう？</div>'
      + '<div class="sheet" style="top:232px"><div class="grip"></div>'
      + list.map(function(i, pos){ return cardHtml(SHOPS[i], i, pos); }).join('')
      + (s.shown < Math.min(15, s.order.length) ? '<button class="more" onclick="more()">もっと見る（+6軒）</button>' : '')
      + '<div style="display:flex;gap:14px"><button class="back" onclick="go(\'idle\')">← 最初から</button><button class="back" onclick="editAns()">条件を変える</button></div></div>';
  } else if(s.screen==='detail'){
    setBot('sz-res', 'idle');
    var sh = SHOPS[s.shop];
    var nz2 = ' nz' + ((sh.n.charCodeAt(0) + sh.n.length) % 4);
    var top2 = sh.img ? '<img src="'+PH[sh.img]+'" style="width:100%;height:118px;object-fit:cover;border-radius:12px">' : (sh.ph ? '<img src="'+PHB+sh.ph[0]+'" style="width:100%;height:118px;object-fit:cover;border-radius:12px">' + (sh.ph.length > 1 ? '<div class="dthumbs">' + sh.ph.slice(1).map(function(f){ return '<img src="'+PHB+f+'">'; }).join('') + '</div>' : '') : '<div class="noimg'+nz2+'" style="height:92px;border-radius:12px">'+sh.g+'（写真は準備中）</div>');
    h = '<div class="sheet" style="top:22px;animation:sheetUp .38s cubic-bezier(.2,.8,.3,1) both"><button class="backbtn" style="top:10px;left:10px" onclick="go(\'results\')">← もどる</button><div class="grip"></div>' + top2
      + '<div style="font-weight:800;font-size:18px;margin-top:7px;color:#111">'+sh.n+'</div>'
      + '<div class="scores">'
      + (sh.gs ? '<span class="sc g">Google ★'+sh.gs+'（'+sh.gc+'件）</span>' : '')
      + (sh.ts ? '<span class="sc t">食べログ '+sh.ts+'（'+sh.tc+'件）</span>' : '')
      + ((sh.g + sh.w + sh.s + sh.tags.join('')).indexOf('飲み放題') >= 0 ? '<span class="sc t">飲み放題あり</span>' : '')
      + '</div>'
      + '<div class="kv" style="margin-top:8px"><div class="krow"><b>住所</b><span>'+sh.a+'</span></div><div class="krow"><b>営業</b><span>'+sh.h+'</span></div><div class="krow"><b>予算</b><span>'+sh.b+'</span></div>'+(sh.s ? '<div class="krow"><b>酒</b><span>'+sh.s+'</span></div>' : '')+'</div>'
      + (sh.w ? '<div class="tip"><img src="'+ANIM.idle+'"><div>'+sh.w+'</div></div>' : '')
      + '<div class="btnrow">'
      + (sh.t ? '<a class="btn tel" href="tel:'+sh.t.replace(/-/g,'')+'">電話する</a>' : '<span class="btn off">電話 未確認</span>')
      + '<button class="btn map" onclick="setPick(true)">地図を開く</button></div>'
      + '</div>';
  }
  if(s.pick && s.shop !== null && s.shop !== undefined){
    var sh2 = SHOPS[s.shop];
    h += '<div class="pickwrap"><div class="pick"><h3>どのマップで開く？</h3>'
      + '<a class="prow" target="_blank" href="'+mapUrl('google', sh2.n + ' ' + areaName())+'">Google マップ</a>'
      + '<a class="prow" target="_blank" href="'+mapUrl('apple', sh2.n + ' ' + areaName())+'">Apple マップ</a>'
      + '<a class="prow" target="_blank" href="'+mapUrl('yahoo', sh2.n + ' ' + areaName())+'">Yahoo!マップ</a>'
      + '<button class="pcancel" onclick="setPick(false)">キャンセル</button></div></div>';
  }
  ui.innerHTML = h;
}
function save(){ window.hatchWidget.setState(window.__S); }
(function(){ function bl(){ var ep = document.getElementById('eyepatch'); if(!ep){ setTimeout(bl, 1200); return; } ep.classList.add('blink'); setTimeout(function(){ ep.classList.remove('blink'); }, 130); setTimeout(bl, 2600 + Math.random()*2400); } setTimeout(bl, 1600); })();

var AC = null;
function beep(f0, f1, dur, vol){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol || 0.10, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function sndTap(){ beep(540, 880, 0.09, 0.10); }
function sndBack(){ beep(360, 240, 0.08, 0.07); }
function sndOpen(){ beep(660, 990, 0.10, 0.09); }

function spawnBurst(cx, cy, n){
  var st = document.getElementById('ph'); if(!st) return;
  var r = st.getBoundingClientRect();
  for(var i = 0; i < (n || 7); i++){
    var b = document.createElement('div');
    b.className = 'fzb';
    var sz = 6 + Math.random() * 9;
    b.style.width = sz + 'px'; b.style.height = sz + 'px';
    b.style.left = (cx - r.left - sz/2) + 'px';
    b.style.top = (cy - r.top - sz/2) + 'px';
    b.style.setProperty('--dx', ((Math.random()*76) - 38).toFixed(0) + 'px');
    b.style.setProperty('--dy', (-(26 + Math.random()*52)).toFixed(0) + 'px');
    b.style.animationDelay = (Math.random() * 0.08).toFixed(2) + 's';
    st.appendChild(b);
    (function(el){ setTimeout(function(){ el.remove(); }, 900); })(b);
  }
}
document.addEventListener('pointerdown', function(e){
  var t = e.target && e.target.closest ? e.target.closest('.bar,.pillbtn,.more,.mapbtn,.card,.prow,.btn,.backbtn,.pcancel') : null;
  if(t) spawnBurst(e.clientX, e.clientY, 7);
});
function botHop(){
  var w = document.getElementById('botwrap'); if(!w) return;
  var wr = w.getBoundingClientRect();
  spawnBurst(wr.left + wr.width/2, wr.top + wr.height*0.16, 4);
  w.classList.remove('hop'); void w.offsetWidth; w.classList.add('hop');
  setTimeout(function(){ w.classList.remove('hop'); }, 480);
}
function go(sc){ sndTap(); botHop(); window.__S.screen = sc; if(sc==='ask'){window.__S.step=0; window.__S.ans={};} if(sc==='results' && !window.__S.order.length){window.__S.screen='idle';} save(); render(); }
function answer(k, v){
  sndTap(); botHop();
  window.__S.ans[k] = v;
  if(window.__S.step < QS.length-1){ window.__S.step++; }
  else { window.__S.screen='think'; save(); render(); setTimeout(function(){ window.__S.order = rankShops(window.__S.ans); window.__S.shown = 3; window.__S.screen='results'; save(); render(); }, 1700); return; }
  save(); render();
}
function backStep(){ sndBack(); if(window.__S.step > 0){ window.__S.step--; } else { window.__S.screen='idle'; } save(); render(); }
function editAns(){ window.__S.screen='ask'; window.__S.step=0; save(); render(); }
function backToLastQ(){ sndBack(); window.__S.screen='ask'; window.__S.step = QS.length - 1; save(); render(); }
function more(){ sndTap(); window.__S.shown = Math.min(15, window.__S.shown + 6); save(); render(); }
function openShop(id){ sndOpen(); window.__S.shop=id; window.__S.screen='detail'; save(); render(); }
function setPick(b){ sndTap(); window.__S.pick=b; save(); render(); }
window.addEventListener('hatch-widget-state', function(e){ window.__S = e.detail.state; render(); });
window.__S = window.hatchWidget.getState(DEF);
syncArea();
setTimeout(tryLocate, 600);
document.getElementById('botlayer').innerHTML = botHtml();
botState.vid = 'idle';
render();
</script>
